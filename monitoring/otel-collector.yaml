# monitoring/otel-collector.yaml

# Recebe traces, métricas e logs da aplicação Flask via gRPC (:4317)
# e encaminha para Tempo (traces) e Prometheus (métricas).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Adiciona atributos extras a todos os sinais
  resource:
    attributes:
      - key: deployment.environment
        value: development
        action: upsert

exporters:
  # Traces → Grafana Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Métricas - Prometheus (via endpoint de scrape)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: motor_busca

  # Logs - stdout (visíveis em `docker compose logs otel-collector`)
  logging:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [otlp/tempo, logging]

    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [prometheus, logging]

    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging]